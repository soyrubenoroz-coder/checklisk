name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * *' # Cada 24 horas a las 12:00 UTC
  workflow_dispatch: # Ejecución manual

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalando dependencias necesarias
        run: npm install pg

      - name: Ping Supabase Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: DATABASE_URL no está configurada en los Secrets de GitHub."
            exit 1
          fi
          
          # Script para conectar y realizar una consulta simple
          node -e "
          const { Client } = require('pg');
          const client = new Client({
            connectionString: process.env.DATABASE_URL,
            ssl: { rejectUnauthorized: false }
          });
          
          client.connect()
            .then(() => {
              console.log('Conexión establecida con éxito.');
              return client.query('SELECT 1');
            })
            .then(() => {
              console.log('Ping realizado con éxito: SELECT 1');
              process.exit(0);
            })
            .catch(err => {
              console.error('Error al conectar con la base de datos:', err.message);
              process.exit(1);
            })
            .finally(() => client.end());
          "
