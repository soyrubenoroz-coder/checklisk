name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * *' # Cada 24 horas a las 12:00 UTC
  workflow_dispatch: # Ejecución manual

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalando dependencias necesarias
        run: npm install pg

      - name: Ping Supabase Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: DATABASE_URL no está configurada en los Secrets de GitHub."
            exit 1
          fi
          
          # Script para conectar y realizar una consulta simple
          node -e "
          const { Client } = require('pg');
          const client = new Client({
            connectionString: process.env.DATABASE_URL,
            ssl: { rejectUnauthorized: false },
            connectionTimeoutMillis: 10000 // Timeout de 10 segundos para evitar colgarse
          });
          
          console.log('Intentando conectar a la base de datos...');
          
          client.connect()
            .then(() => {
              console.log('✅ Conexión establecida con éxito.');
              return client.query('SELECT 1');
            })
            .then(() => {
              console.log('✅ Ping realizado con éxito: SELECT 1');
              process.exit(0);
            })
            .catch(err => {
              console.error('❌ Error al conectar con la base de datos:');
              console.error(err.message);
              console.error('\n--- ⚠️ POSIBLES CAUSAS Y SOLUCIONES ---');
              console.error('1. PROYECTO PAUSADO: Tu proyecto en Supabase se ha pausado por inactividad. Ve al dashboard de Supabase (https://supabase.com/dashboard) y reactívalo manualmente.');
              console.error('2. PROBLEMA DE IPv4 (Muy común): Supabase ya no soporta conexiones directas IPv4. Si tu secret DATABASE_URL usa db.[tu-ref].supabase.co, fallará. Debes actualizar el secret DATABASE_URL en GitHub Actions para usar la URL del Pooler (ej. aws-0-[region].pooler.supabase.com:6543).');
              console.error('3. CONTRASEÑA INCORRECTA: Verifica que el secret DATABASE_URL esté correctamente escrito en la configuración de GitHub.');
              process.exit(1);
            })
            .finally(() => client.end());
          "
